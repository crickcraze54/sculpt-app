<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sculpt" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Sculpt</title>
  <style>
    :root {
      --bg: #0a0d16;
      --panel: #131a2b;
      --panel-2: #1a2338;
      --line: #232d47;
      --text: #f5f7fb;
      --muted: #8b93a8;
      --accent: #3b6fed;
      --accent-2: #2dd4a7;
      --grad: linear-gradient(90deg, #4f7fff, #2dd4a7);
      --warn: #fbbf24;
      --danger: #ff6b6b;
      --protein: #ff6b6b;
      --carbs: #34d399;
      --fat: #fbbf24;
      --push-a: #4f8bff;
      --pull-a: #34d399;
      --push-b: #b18cff;
      --pull-b: #ffcc7a;
      --radius: 20px;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; overflow-x:hidden; }
    body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 760px; margin:0 auto; padding: calc(14px + env(safe-area-inset-top)) 14px 24px; overflow-x:hidden; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .brand h1 { font-size:24px; line-height:1.05; margin:0; letter-spacing:-.03em; }
    .brand p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .badge { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:8px 10px; color:var(--muted); font-size:12px; white-space:nowrap; }
    .section-title { display:flex; align-items:end; justify-content:space-between; margin:24px 2px 10px; gap:8px; }
    .section-title h2 { margin:0; font-size:18px; letter-spacing:-.02em; }
    .section-title span { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .card { background:linear-gradient(180deg, var(--panel), #0e1424); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
    .eyebrow { display:block; text-transform:uppercase; letter-spacing:.09em; font-size:11px; font-weight:800; color:var(--accent-2); margin:0 2px 5px; }
    .workout-card { padding:16px; min-height:148px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; }
    .workout-card::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--wcolor); }
    .workout-card h3 { margin:0 0 5px; font-size:18px; }
    .workout-card p { margin:0; color:var(--muted); font-size:12px; line-height:1.45; }
    .workout-meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .mini { font-size:11px; color:#c9d0d8; background:#191f26; border:1px solid #272f38; padding:5px 7px; border-radius:999px; }
    .primary, .secondary, .danger-btn, .grad-btn { border:0; border-radius:14px; min-height:48px; padding:0 16px; font-weight:700; }
    .primary { background:var(--accent); color:#fff; }
    .grad-btn { background:var(--grad); color:#04101c; box-shadow:0 10px 26px rgba(45,212,167,.22); display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .secondary { background:var(--panel-2); color:var(--text); border:1px solid var(--line); }
    .danger-btn { background:#2a1416; color:#ff9d9d; border:1px solid #4a2227; }
    .wide { width:100%; }
    .hero { padding:18px; }
    .hero-row { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .hero h2 { margin:0 0 5px; font-size:22px; }
    .hero p { margin:0; color:var(--muted); font-size:13px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
    .stat { background:#0d1115; border:1px solid var(--line); border-radius:14px; padding:12px; min-width:0; }
    .stat strong { display:block; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .stat span { color:var(--muted); font-size:11px; }
    .notice { border:1px solid #3c3321; background:#1b1710; color:#ffe1a5; padding:12px 14px; border-radius:14px; font-size:12px; line-height:1.45; }
    .notice.good { border-color:#284a31; background:#101712; color:#c8f0d3; }
    .notice.info { border-color:#243040; background:#0f1620; color:#bcd6ee; }
    .resume { border-color:#284a31; background:linear-gradient(180deg,#132019,#101712); }
    .resume h3 { margin:0 0 6px; }
    .screen { display:none; }
    .screen.active { display:block; }
    .nav { position:fixed; left:0; right:0; bottom:0; z-index:50; background:rgba(10,13,22,.94); backdrop-filter:blur(18px); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
    .nav-inner { max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr); gap:2px; }
    .nav button { background:transparent; border:0; color:var(--muted); border-radius:12px; padding:6px 2px; font-size:9.5px; font-weight:700; min-width:0; }
    .nav button.active { color:var(--accent); background:rgba(59,111,237,.14); }
    .nav .ico { display:block; font-size:17px; margin-bottom:2px; }
    .subnav { display:flex; gap:6px; margin:10px 2px 14px; flex-wrap:wrap; background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:4px; }
    .subnav button { flex:1 1 auto; min-width:0; border:0; background:transparent; color:var(--muted); border-radius:10px; padding:9px 8px; font-size:12px; font-weight:700; white-space:nowrap; }
    .subnav button.active { background:var(--accent); color:#fff; }
    .workout-head { position:sticky; top:0; z-index:20; background:rgba(11,13,16,.92); backdrop-filter:blur(14px); margin:-2px -14px 12px; padding:6px 14px 12px; border-bottom:1px solid rgba(37,44,52,.75); }
    .workout-head-top { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .workout-head h2 { margin:0; font-size:22px; }
    .progressbar { margin-top:10px; height:6px; background:#1c2229; border-radius:999px; overflow:hidden; }
    .progressbar > div { height:100%; background:var(--accent); width:0%; transition:width .25s; }
    .exercise { margin:10px 0; padding:15px; }
    .exercise-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .exercise h3 { font-size:16px; margin:0; line-height:1.25; }
    .exercise-meta { color:var(--muted); font-size:11px; margin-top:5px; line-height:1.4; }
    .muscle-tag { display:inline-flex; padding:4px 7px; border-radius:999px; background:#162018; border:1px solid #2b4631; color:#b7efc3; font-size:10px; margin-top:8px; }
    .cue { font-size:12px; color:#cbd2da; background:#0e1216; border:1px solid var(--line); border-radius:12px; padding:9px 10px; margin:12px 0; line-height:1.45; }
    .set-head, .set-row { display:grid; grid-template-columns:34px 1.15fr .9fr .8fr 42px; gap:7px; align-items:center; }
    .set-head { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.05em; margin:6px 0; }
    .set-row { margin:7px 0; }
    .set-num { width:30px; height:30px; display:grid; place-items:center; border-radius:10px; background:#171c22; color:#dbe1e7; font-size:12px; font-weight:800; }
    .set-row input, .detail-input, textarea, select.detail-input { width:100%; color:var(--text); background:#0c1014; border:1px solid #2c343d; border-radius:11px; min-height:42px; padding:9px 10px; outline:none; }
    .set-row input:focus, .detail-input:focus, textarea:focus { border-color:#5d7865; box-shadow:0 0 0 2px rgba(142,227,161,.08); }
    .done { width:40px; height:40px; border-radius:12px; border:1px solid #303943; background:#151b21; color:#7b8793; font-weight:900; }
    .done.on { background:var(--accent); border-color:var(--accent); color:#071108; }
    .last { color:#70808e; font-size:10px; margin-top:3px; min-height:12px; }
    details { margin-top:10px; }
    summary { color:#aeb8c2; font-size:11px; cursor:pointer; }
    .exercise-extra { display:grid; gap:8px; margin-top:10px; }
    textarea { min-height:70px; resize:vertical; }
    .timer { position:fixed; z-index:80; right:14px; bottom:calc(80px + env(safe-area-inset-bottom)); border-radius:18px; background:#edf9ef; color:#0b1a0f; box-shadow:0 12px 34px rgba(0,0,0,.35); padding:11px 13px; display:none; align-items:center; gap:10px; }
    .timer.show { display:flex; }
    .timer strong { font-variant-numeric:tabular-nums; font-size:18px; min-width:48px; }
    .timer button { border:0; background:#d4ecd9; border-radius:10px; min-width:34px; height:34px; font-weight:800; }
    .quick-timer { display:flex; gap:7px; margin-top:10px; }
    .quick-timer button { flex:1; min-height:36px; border-radius:10px; border:1px solid var(--line); color:#cfd6de; background:#151a20; font-size:11px; }
    .history-card { padding:14px; margin:9px 0; }
    .history-top { display:flex; justify-content:space-between; gap:12px; }
    .history-card h3 { margin:0; font-size:15px; }
    .history-card p { color:var(--muted); margin:4px 0 0; font-size:11px; }
    .pill { display:inline-flex; border-radius:999px; padding:5px 8px; font-size:10px; background:#181e24; border:1px solid var(--line); color:#cbd3dc; white-space:nowrap; }
    .settings-card { padding:16px; margin:10px 0; }
    .settings-card h3 { margin:0 0 10px; font-size:15px; }
    .settings-card p { color:var(--muted); font-size:12px; line-height:1.5; }
    .row { display:flex; gap:8px; flex-wrap:wrap; }
    .row > * { flex:1; min-width:0; }
    .field { margin:8px 0; }
    .field label { display:block; font-size:11px; color:var(--muted); margin-bottom:5px; }
    .small { font-size:11px; color:var(--muted); }
    .macrobar-wrap { margin:12px 0; }
    .macrobar-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; }
    .macrobar-label b { color:var(--mcolor, var(--text)); }
    .macrobar { height:7px; background:#1c2436; border-radius:999px; overflow:hidden; }
    .macrobar > div { height:100%; background:var(--mcolor, var(--accent)); border-radius:999px; }
    .macrobar > div.over { background:var(--danger); }
    .over-text { color:var(--danger); font-weight:700; }
    .ring-wrap { position:relative; display:flex; justify-content:center; padding:8px 0 4px; }
    .ring-overlay { position:absolute; inset:8px 0 4px 0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .ring-value { font-size:32px; font-weight:800; letter-spacing:-.02em; }
    .ring-label { color:var(--muted); font-size:12px; margin-top:2px; }
    .modal-backdrop { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.7); display:none; align-items:flex-end; }
    .modal-backdrop.show { display:flex; }
    .modal { width:100%; max-width:760px; margin:0 auto; border-radius:24px 24px 0 0; background:#11151a; border:1px solid #2a3139; padding:20px 16px calc(18px + env(safe-area-inset-bottom)); max-height:82vh; overflow:auto; }
    .modal h3 { margin:0 0 6px; }
    .modal p { color:var(--muted); font-size:12px; line-height:1.55; }
    .toast { position:fixed; z-index:120; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); background:#eef7f0; color:#0d1b10; border-radius:999px; padding:10px 14px; font-size:12px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; text-align:center; }
    .toast.show { opacity:1; }
    .food-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-top:1px solid #1c222a; }
    .food-row:first-child { border-top:0; }
    .food-row .fname { font-size:13px; font-weight:700; }
    .food-row .fmeta { font-size:11px; color:var(--muted); margin-top:2px; }
    .icon-btn { border:1px solid var(--line); background:var(--panel-2); color:var(--text); border-radius:10px; min-height:34px; padding:0 10px; font-size:11px; font-weight:700; }
    .list-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
    .plan-result { padding:14px; margin:10px 0; }
    .plan-result h4 { margin:0 0 4px; font-size:14px; }
    .tag-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .pill.unlocked { background:rgba(45,212,167,.14); border-color:#215a48; color:#8fe9c9; }
    .pill.locked { color:#5c667c; }
    .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .cal-header b { font-size:13px; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
    .cal-dow { color:var(--muted); font-size:10px; margin-bottom:4px; }
    .cal-cell { position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text); border-radius:8px; }
    .cal-cell.empty { visibility:hidden; }
    .cal-cell.today { box-shadow:inset 0 0 0 1.5px var(--accent); border-radius:999px; font-weight:800; color:var(--accent); }
    .cal-dot { position:absolute; bottom:2px; width:5px; height:5px; border-radius:999px; background:var(--muted); }
    .cal-dot.completed { background:var(--carbs); }
    .cal-dot.partial { background:var(--warn); }
    .tag-row .pill .cal-dot { position:static; display:inline-block; margin-right:4px; }
    .exercise-lib-row { padding:12px 14px; margin:8px 0; }
    @media (max-width:460px) {
      .grid { grid-template-columns:1fr 1fr; }
      .workout-card { min-height:138px; padding:14px; }
      .set-head, .set-row { grid-template-columns:30px 1.1fr .8fr .72fr 40px; gap:5px; }
      .exercise { padding:13px; }
      .nav .ico { font-size:16px; }
      .nav button { font-size:9px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Sculpt</h1>
        <p>Training + nutrition + progress</p>
      </div>
      <div class="badge" id="todayBadge">Today</div>
    </header>

    <main>
      <section id="todayScreen" class="screen active"></section>
      <section id="trainScreen" class="screen"></section>
      <section id="eatScreen" class="screen"></section>
      <section id="planScreen" class="screen"></section>
      <section id="progressScreen" class="screen"></section>
      <section id="settingsScreen" class="screen"></section>
    </main>
  </div>

  <div class="timer" id="timerBox">
    <span>Rest</span><strong id="timerText">01:30</strong><button id="timerStop">×</button>
  </div>
  <div class="toast" id="toast"></div>

  <nav class="nav">
    <div class="nav-inner">
      <button data-screen="today" class="active"><span class="ico">⌂</span>Today</button>
      <button data-screen="train"><span class="ico">🏋</span>Train</button>
      <button data-screen="eat"><span class="ico">🍽</span>Eat</button>
      <button data-screen="plan"><span class="ico">🧮</span>Plan</button>
      <button data-screen="progress"><span class="ico">📈</span>Progress</button>
      <button data-screen="settings"><span class="ico">⚙</span>Settings</button>
    </div>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>

<script>
/* =========================================================================
   PROGRAM — unchanged workout prescriptions, carried over verbatim from
   the original Sculpt PPL tracker. Do not alter exercises/sets/reps here.
   ========================================================================= */
const PROGRAM = {
  pushA: {
    name: 'Push A', color: 'var(--push-a)', focus: 'Upper chest + lateral delts + triceps',
    exercises: [
      ['pa1','Low-Incline Smith Press (20–30°)',4,'6–10','2.5–3 min','2→1','Upper chest','Controlled deep eccentric; keep the incline low enough that your pecs—not front delts—dominate.'],
      ['pa2','Low-Incline Dumbbell Press',3,'8–12','2–3 min','1–2','Upper chest','Use a comfortable deep ROM. Log the weight of ONE dumbbell.'],
      ['pa3','Low-to-High Cable Fly',3,'10–15','1.5–2 min','1','Upper chest','Bring the arms up and inward; do not turn it into a front raise.'],
      ['pa4','Behind-the-Body Single-Arm Cable Lateral Raise',4,'10–15','1.5 min','1','Lateral delt','Lead with the elbow and keep shrugging minimal.'],
      ['pa5','Machine Lateral Raise',4,'12–20','1–1.5 min','1→0','Lateral delt','Keep the torso fixed; progress reps before load.'],
      ['pa6','Overhead Cable Triceps Extension',3,'8–12','1.5–2 min','1','Triceps long head','Keep the upper arm stable and control the stretch.'],
      ['pa7','Cross-Body Cable Triceps Extension / Pressdown',3,'10–15','1.5 min','1→0','Triceps','Use the version that gives you the cleanest elbow path.']
    ]
  },
  pullA: {
    name: 'Pull A', color: 'var(--pull-a)', focus: 'Lat width + lat sweep + biceps',
    exercises: [
      ['pla1','Neutral / Medium-Grip Pull-Up or Pulldown',4,'6–10','2.5 min','1–2','Lats / width','Think elbow down toward your side pocket; do not turn it into a row.'],
      ['pla2','One-Arm Lat Pulldown',3,'8–12','2 min','1','Lats','Use a full overhead reach and drive the elbow toward the hip.'],
      ['pla3','One-Arm Cable Lat Row',3,'10–15','1.5–2 min','1','Lat sweep','Keep the upper arm close to the torso; pull the elbow toward the hip.'],
      ['pla4','Cable Pullover / Straight-Arm Pulldown',3,'10–15','1.5 min','1','Lats','Keep elbow angle nearly fixed; move through shoulder extension.'],
      ['pla5','Chest-Supported Neutral Row',3,'8–12','2 min','1–2','Lats + mid-back','Do not bounce your chest off the pad.'],
      ['pla6','Bayesian Cable Curl',3,'10–15','1.5 min','1','Biceps','Keep the shoulder slightly behind the torso and control the lengthened position.'],
      ['pla7','Preacher Curl',3,'8–12','1.5–2 min','1','Biceps','Keep the upper arm planted; no shoulder roll.'],
      ['pla8','Cross-Body Hammer Curl',2,'10–15','1.5 min','1','Brachialis / brachioradialis','Neutral grip; no torso swing.']
    ]
  },
  pushB: {
    name: 'Push B', color: 'var(--push-b)', focus: 'Delt architecture + rear delts + upper chest + triceps',
    exercises: [
      ['pb1','Machine Shoulder Press',3,'6–10','2.5 min','2','Delts','Use a stable path and stop before technique degrades.'],
      ['pb2','Machine / Cable Lateral Raise',4,'10–15','1.5 min','1','Lateral delt','Keep your neck relaxed and lead with the elbow.'],
      ['pb3','Leaning Single-Arm Cable Lateral Raise',4,'12–20','1–1.5 min','1→0','Lateral delt','Use controlled reps; do not chase stack weight.'],
      ['pb4','Reverse Pec Deck',4,'12–20','1.5 min','1','Rear delt','Drive the upper arm outward; avoid excessive shrugging.'],
      ['pb5','Incline Machine / Smith Press',3,'8–12','2 min','1–2','Upper chest','Upper-chest reinforcement; no need for maximal loading.'],
      ['pb6','Cable Fly — Midline',2,'12–15','1.5 min','1','Chest maintenance','Use a controlled stretch and squeeze.'],
      ['pb7','Overhead Cable Triceps Extension',3,'10–15','1.5 min','1','Triceps long head','Keep shoulder position stable.'],
      ['pb8','Single-Arm Pressdown',2,'12–15','1 min','0–1','Triceps','Safe final isolation work.']
    ]
  },
  pullB: {
    name: 'Pull B', color: 'var(--pull-b)', focus: '3D back + traps + rear delts + arms',
    exercises: [
      ['plb1','Chest-Supported T-Bar Row',4,'6–10','2.5–3 min','1–2','Mid-back / mid traps','Retract under control; no torso heave.'],
      ['plb2','High Chest-Supported Row (elbows 45–70°)',3,'8–12','2 min','1','Upper back / mid traps','Pull wider than your lat row and make scapular retraction deliberate.'],
      ['plb3','Neutral-Grip Lat Pulldown',2,'8–12','2 min','1','Lats','Use a full reach; drive the elbow down.'],
      ['plb4','One-Arm Cable Pulldown',2,'10–15','1.5 min','1','Lats','Controlled unilateral lat work.'],
      ['plb5','Reverse Pec Deck',3,'12–20','1.5 min','1→0','Rear delt','Rear-delt emphasis; do not shrug.'],
      ['plb6','Cable Rear-Delt Fly',2,'12–20','1–1.5 min','1→0','Rear delt','Keep the arm path consistent.'],
      ['plb7','Smith / Machine Shrug',3,'8–12','1.5–2 min','1','Upper traps','Elevate the shoulders vertically, pause briefly, and do not roll them.'],
      ['plb8','Cable Y-Raise',2,'12–20','1–1.5 min','1–2','Lower-trap emphasis','Use light load and a clean Y path without lumbar extension.'],
      ['plb9','Incline Dumbbell Curl',3,'8–12','1.5 min','1','Biceps','Keep the shoulder extended and upper arm stable.'],
      ['plb10','Hammer Curl',2,'8–12','1.5 min','1','Brachialis / brachioradialis','Neutral grip with a controlled eccentric.']
    ]
  }
};
const WORKOUT_ORDER = ['pushA','pullA','pushB','pullB'];

/* =========================================================================
   Core helpers
   ========================================================================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

// Central HTML-escaping helper. Use before interpolating ANY user- or
// API-derived string into innerHTML (meal names, notes, saved-food names,
// setup notes, parsed AI text, etc).
function esc(s=''){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

// LOCAL calendar date as YYYY-MM-DD (device timezone, NOT UTC). Never use
// new Date().toISOString().split('T')[0] — that reports the UTC day, which
// is wrong for the second half of most local days.
function localDateStr(d){
  d = d instanceof Date ? d : new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDate(ts){ return new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date(ts)); }
function todayLong(){ return new Intl.DateTimeFormat(undefined,{weekday:'short',day:'numeric',month:'short'}).format(new Date()); }
function round1(n){ return Math.round((Number(n)||0)*10)/10; }
function num(v,def=0){ const n=parseFloat(v); return Number.isFinite(n)?n:def; }

/* =========================================================================

const NS = {

function loadNS(key, factory){
  const raw = localStorage.getItem(key);

  }
  return factory();
}
function saveNS(key,val){ localStorage.setItem(key, JSON.stringify(val)); }
function saveAll(){

let migrationResult = {ran:false};
function migrateLegacyData(){
  if(localStorage.getItem(NS.migrated)==='true') return {ran:false};
  let trainingCopied=false, sessionsCopied=0, mealsCopied=0, legacyTargets=null;

  try {
    const legacy = JSON.parse(localStorage.getItem('sculptPPL.v1'));
    if(legacy && (Array.isArray(legacy.sessions) || legacy.active)){
      training.sessions = Array.isArray(legacy.sessions) ? legacy.sessions : [];
      training.active = legacy.active || null;
      training.settings = legacy.settings || {unit:'kg'};
      trainingCopied = true; sessionsCopied = training.sessions.length;
    }
  } catch(e){}

  try {
    const legacyLogKeys = Object.keys(localStorage).filter(k=>/^logs_\d{4}-\d{2}-\d{2}$/.test(k));
    legacyLogKeys.forEach(k=>{
      const date = k.slice(5);
      let arr = [];
      try { arr = JSON.parse(localStorage.getItem(k)) || []; } catch(e){ arr = []; }
      arr.forEach(m=>{
        const ts = Number(m.id) || Date.now();
        nutrition.meals.push({
          id: 'legacy_'+(m.id!=null?m.id:uid()),
          date, ts,
          time: m.time || new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(new Date(ts)),
          name: m.name || 'Meal',
          calories: Math.round(num(m.cal)),
          protein: round1(num(m.pro)),
          carbs: round1(num(m.carb)),
          fat: round1(num(m.fat)),
          source: 'legacy-import',
          notes: m.details || ''
        });
        mealsCopied++;
      });
    });
  } catch(e){}

  try {
    const t = JSON.parse(localStorage.getItem('macro_targets'));
    if(t) legacyTargets = t;
  } catch(e){}

  if(!settingsExistedBefore){
    settings = defaultSettings();
  }
  settings.legacyMigrationMeta = legacyTargets ? {importedTargets:legacyTargets, importedAt:Date.now()} : settings.legacyMigrationMeta || null;

  saveAll();
  localStorage.setItem(NS.migrated,'true');
  return {ran:true, trainingCopied, sessionsCopied, mealsCopied};
}
migrationResult = migrateLegacyData();

/* =========================================================================
   TRAIN module (workout logging) — behavior preserved from Sculpt PPL v1
   ========================================================================= */
let trainSubview = 'program'; // 'program' | 'log' | 'history' | 'library'
let libraryQuery = '';
let libraryMuscle = 'all';

function totalSets(workout){ return workout.exercises.reduce((n,e)=>n+e[2],0); }
function completedSets(active){
  if(!active) return 0;
  return Object.values(active.entries).reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
}
function lastSessionFor(workoutId){ return training.sessions.find(s=>s.workoutId===workoutId) || null; }
function newestFirst(){ training.sessions.sort((a,b)=>b.finishedAt-a.finishedAt); }

// ---- Derived training stats (pure functions over existing session data;
// nothing new is stored, everything here is recomputed on demand) ----

// Consecutive-day training streak, counting back from today. A day with no
// finished session breaks the streak. If nothing is logged today yet, the
// streak still counts from yesterday backward (so it doesn't zero out at
// midnight before you've had a chance to train).
function trainingStreak(){
  const days = new Set(training.sessions.map(s=>localDateStr(new Date(s.finishedAt))));
  let streak = 0;
  let cursor = new Date();
  if(!days.has(localDateStr(cursor))) cursor = new Date(cursor.getTime()-86400000);
  while(days.has(localDateStr(cursor))){
    streak++;
    cursor = new Date(cursor.getTime()-86400000);
  }
  return streak;
}
function hoursTrained(){
  const ms = training.sessions.reduce((sum,s)=> sum + Math.max(0,(s.finishedAt||0)-(s.startedAt||0)), 0);
  return ms/3600000;
}
// Heaviest logged load per exercise across all history, with the date and
// which workout/session it came from. Only considers sets with a positive
// numeric load actually entered.
function personalRecords(){
  const best = {}; // exerciseId -> {load, reps, date, exerciseName}
  training.sessions.forEach(s=>{
    const w = PROGRAM[s.workoutId]; if(!w) return;
    w.exercises.forEach(ex=>{
      const [id, name] = ex;
      const entry = s.entries && s.entries[id]; if(!entry) return;
      entry.sets.forEach(set=>{
        const load = parseFloat(set.load);
        if(!Number.isFinite(load) || load<=0) return;
        if(!best[id] || load>best[id].load){
          best[id] = {load, reps:set.reps, date:s.finishedAt, exerciseName:name};
        }
      });
    });
  });
  return Object.entries(best).map(([id,r])=>({exerciseId:id, ...r})).sort((a,b)=>b.load-a.load);
}

function renderTrain(){
  const el = document.getElementById('trainScreen');
  let html = `<div class="subnav">
    <button data-tsub="program" class="${trainSubview==='program'?'active':''}">Program</button>
    <button data-tsub="log" class="${trainSubview==='log'?'active':''}">${training.active?'Active log':'Log'}</button>
    <button data-tsub="history" class="${trainSubview==='history'?'active':''}">History (${training.sessions.length})</button>
    <button data-tsub="library" class="${trainSubview==='library'?'active':''}">Library</button>
  </div>`;
  if(trainSubview==='program') html += trainProgramHtml();
  else if(trainSubview==='log') html += trainLogHtml();
  else if(trainSubview==='library') html += trainLibraryHtml();
  else html += trainHistoryHtml();
  el.innerHTML = html;
  el.querySelectorAll('[data-tsub]').forEach(b=>b.addEventListener('click',()=>{ trainSubview=b.dataset.tsub; renderTrain(); }));
  wireLibraryEvents();
}

// Read-only exercise library — browses the existing PROGRAM prescriptions
// by muscle group with a search box. Never edits sets/reps/prescriptions.
function allExercisesFlat(){
  const rows = [];

}

  html += `</div>

function makeActive(workoutId){
  const w=PROGRAM[workoutId];
  const prev=lastSessionFor(workoutId);
  const entries={};
  w.exercises.forEach(ex=>{
    const [id,,setCount] = ex;
    const prevSets = prev?.entries?.[id]?.sets || [];
    entries[id] = {
      setup: prev?.entries?.[id]?.setup || '', note:'',
      sets:Array.from({length:setCount},(_,i)=>({load:prevSets[i]?.load||'',reps:'',rir:'',done:false}))
    };
  });
  training.active={id:uid(),workoutId,startedAt:Date.now(),entries};
  saveNS(NS.training, training);
}
function startWorkout(id){
  if(training.active){
    if(training.active.workoutId===id){ trainSubview='log'; showScreen('train'); return; }
    if(!confirm(`You already have ${PROGRAM[training.active.workoutId].name} in progress. Replace it with ${PROGRAM[id].name}?`)) return;
  }
  makeActive(id);
  shuffledWorkoutId = null;
  trainSubview='log'; showScreen('train');
}
function goTrainLog(){ trainSubview='log'; showScreen('train'); }

function trainLogHtml(){
  if(!training.active){ return `<div class="card hero"><h2>No active workout</h2><p>Choose a workout from the Program tab to start logging.</p><button class="primary wide" style="margin-top:14px" onclick="trainSubview='program';renderTrain();">Choose workout</button></div>`; }
  const a=training.active,w=PROGRAM[a.workoutId];
  const done=completedSets(a), total=totalSets(w), pct=Math.round(done/total*100);
  let html=`<div class="workout-head"><div class="workout-head-top"><div><h2>${esc(w.name)}</h2><div class="small">${esc(w.focus)}</div></div><span class="pill">${done}/${total} sets</span></div><div class="progressbar"><div style="width:${pct}%"></div></div></div>`;
  const prev=lastSessionFor(a.workoutId);
  w.exercises.forEach(ex=>{
    const [id,name,setCount,reps,rest,rir,muscle,cue]=ex;
    const ent=a.entries[id];
    html+=`<div class="card exercise"><div class="exercise-head"><div><h3>${esc(name)}</h3><div class="exercise-meta">${setCount} sets · ${esc(reps)} reps · ${esc(rest)} rest · RIR ${esc(rir)}</div><div class="muscle-tag">${esc(muscle)}</div></div></div><div class="cue">${esc(cue)}</div>
    <div class="set-head"><span>Set</span><span>Load</span><span>Reps</span><span>RIR</span><span>Done</span></div>`;
    ent.sets.forEach((s,i)=>{
      const p=prev?.entries?.[id]?.sets?.[i];
      const lasttxt=p && (p.load||p.reps||p.rir!=='' ) ? `Last: ${esc(p.load||'—')} ${esc(training.settings.unit)} × ${esc(p.reps||'—')} @${p.rir===''?'—':esc(p.rir)}` : '';
      html+=`<div class="set-row">
        <div class="set-num">${i+1}</div>
        <div><input inputmode="decimal" placeholder="${esc(p?.load||'kg')}" value="${esc(s.load)}" onchange="updateSet('${id}',${i},'load',this.value,this)"><div class="last">${lasttxt}</div></div>
        <input inputmode="numeric" placeholder="${esc(reps)}" value="${esc(s.reps)}" onchange="updateSet('${id}',${i},'reps',this.value,this)">
        <input inputmode="numeric" placeholder="${esc(rir)}" value="${esc(s.rir)}" onchange="updateSet('${id}',${i},'rir',this.value,this)">
        <button class="done ${s.done?'on':''}" onclick="toggleDone('${id}',${i},this)">${s.done?'✓':'○'}</button>
      </div>`;
    });
    html+=`<details><summary>Setup & notes</summary><div class="exercise-extra"><input class="detail-input" placeholder="Machine / setup (seat, handle, bench angle...)" value="${esc(ent.setup)}" onchange="updateEntry('${id}','setup',this.value)"><textarea placeholder="Pain, grip change, unusual fatigue, technique issue..." onchange="updateEntry('${id}','note',this.value)">${esc(ent.note)}</textarea></div></details>
    <div class="quick-timer"><button onclick="startTimer(60)">60s</button><button onclick="startTimer(90)">90s</button><button onclick="startTimer(120)">2m</button><button onclick="startTimer(180)">3m</button></div></div>`;
  });
  html+=`<div class="card settings-card"><h3>Finish workout</h3><p>${done} of ${total} working sets marked complete. You can finish even if you intentionally skipped a set; the history will preserve exactly what you logged.</p><button class="primary wide" onclick="finishWorkout()">Finish & save session</button><button class="secondary wide" style="margin-top:8px" onclick="cancelWorkout()">Cancel active workout</button></div>`;
  return html;
}

function updateSet(exId,i,key,val,inputEl){
  const s = training.active.entries[exId].sets[i];
  if(key==='load'){
    const n = parseFloat(val);
    if(val!=='' && Number.isFinite(n) && n<0){
      toast('Load cannot be negative');
      if(inputEl) inputEl.value = s.load;
      return;
    }
  }
  if(key==='reps'){
    const n = parseFloat(val);
    if(Number.isFinite(n) && n>50){
      if(!confirm(`${n} reps is unusually high — confirm this is intentional?`)){
        if(inputEl) inputEl.value = s.reps;
        return;
      }
    }
  }
  if(key==='rir'){
    const n = parseFloat(val);
    if(val!=='' && Number.isFinite(n) && (n<0 || n>5)){
      toast('RIR is typically 0–5 — value saved as entered');
    }
  }
  s[key]=val; saveNS(NS.training, training);
}
function updateEntry(exId,key,val){ training.active.entries[exId][key]=val; saveNS(NS.training, training); }
function toggleDone(exId,i,btn){
  const s=training.active.entries[exId].sets[i]; s.done=!s.done; saveNS(NS.training, training);
  btn.classList.toggle('on',s.done); btn.textContent=s.done?'✓':'○';
  const w=PROGRAM[training.active.workoutId], done=completedSets(training.active), total=totalSets(w);
  const pillEl = document.querySelector('.workout-head .pill');
  if(pillEl) pillEl.textContent=`${done}/${total} sets`;
  const barEl = document.querySelector('.progressbar > div');
  if(barEl) barEl.style.width=Math.round(done/total*100)+'%';
}
function finishWorkout(){
  if(!training.active) return;
  const total=totalSets(PROGRAM[training.active.workoutId]);
  const completed=completedSets(training.active);
  if(completed===0 && !confirm('No sets are marked complete. Save this session anyway?')) return;
  const saved={...training.active,finishedAt:Date.now(),completedSets:completed,totalSets:total};
  training.sessions.unshift(saved); training.active=null; newestFirst(); saveNS(NS.training, training);
  toast('Workout saved'); trainSubview='history'; showScreen('train');
}
function cancelWorkout(){ if(confirm('Delete the current in-progress workout? Logged data from this active session will be lost.')){ training.active=null; saveNS(NS.training, training); trainSubview='program'; showScreen('train'); } }

function trainHistoryHtml(){

function openSession(id){
  const s=training.sessions.find(x=>x.id===id); if(!s) return;
  const w=PROGRAM[s.workoutId];
  let html=`<h3>${esc(w.name)} · ${fmtDate(s.finishedAt)}</h3><p>${esc(w.focus)}</p>`;
  w.exercises.forEach(ex=>{

    ent.sets.forEach((x,i)=> html+=`<div class="small" style="padding:4px 0;border-top:1px solid #222a31">Set ${i+1}: <b style="color:#f4f7fa">${esc(x.load||'—')} ${esc(training.settings.unit)} × ${esc(x.reps||'—')} @ RIR ${x.rir===''?'—':esc(x.rir)}</b> ${x.done?'✓':''}</div>`);
    if(ent.setup) html+=`<div class="small" style="margin-top:6px">Setup: ${esc(ent.setup)}</div>`;
    if(ent.note) html+=`<div class="small">Note: ${esc(ent.note)}</div>`;
    html+=`</div>`;
  });
  html+=`<button class="secondary wide" onclick="closeModal()">Close</button>`;
  showModal(html);
}

function startTimer(sec){
  timerEnd=Date.now()+sec*1000; clearInterval(timerInterval); document.getElementById('timerBox').classList.add('show');
  tickTimer(); timerInterval=setInterval(tickTimer,250);
}
function tickTimer(){
  const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
  const m=Math.floor(left/60), s=left%60; document.getElementById('timerText').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(left<=0){ clearInterval(timerInterval); timerInterval=null; if(navigator.vibrate) navigator.vibrate([120,70,120]); toast('Rest complete'); document.getElementById('timerBox').classList.remove('show'); }
}

/* =========================================================================
   FOODS module — deterministic saved-food store
   ========================================================================= */
function findFood(id){ return foods.foods.find(f=>f.id===id) || null; }
function isWeightUnit(u){ return ['g','kg','oz','lb'].includes(u); }
function isVolumeUnit(u){ return ['ml','l'].includes(u); }
function toGrams(qty,unit){
  switch(unit){ case 'g': return qty; case 'kg': return qty*1000; case 'oz': return qty*28.3495; case 'lb': return qty*453.592; default: return null; }
}
function toMl(qty,unit){ switch(unit){ case 'ml': return qty; case 'l': return qty*1000; default: return null; } }

// Returns scale factor (qty relative to the food's basis), or null if the
// requested unit is not compatible with the food's basis unit (in which
// case the caller must fall back to manual entry — we never guess).
function foodScaleFactor(food, qty, unit){
  if(!food || !Number.isFinite(qty) || qty<=0) return null;
  if(unit === food.basisUnit) return qty/food.basisQty;
  if(isWeightUnit(unit) && isWeightUnit(food.basisUnit)){
    const g = toGrams(qty,unit), bg = toGrams(food.basisQty, food.basisUnit);
    if(g!=null && bg) return g/bg;
  }
  if(isVolumeUnit(unit) && isVolumeUnit(food.basisUnit)){
    const ml = toMl(qty,unit), bml = toMl(food.basisQty, food.basisUnit);
    if(ml!=null && bml) return ml/bml;
  }
  return null;
}
function scaledMacros(food, qty, unit){
  const f = foodScaleFactor(food, qty, unit);
  if(f==null) return null;
  return {
    calories: Math.round(food.calories*f),
    protein: round1(food.protein*f),
    carbs: round1(food.carbs*f),
    fat: round1(food.fat*f)
  };
}
function upsertFood(f){
  const i = foods.foods.findIndex(x=>x.id===f.id);
  if(i>=0) foods.foods[i]=f; else foods.foods.push(f);
  saveNS(NS.foods, foods);
}
function deleteFood(id){
  foods.foods = foods.foods.filter(f=>f.id!==id);
  saveNS(NS.foods, foods);
}

function mealsForDate(d){ return nutrition.meals.filter(m=>m.date===d); }
function sumMacros(meals){

    acc.calories += num(m.calories); acc.protein += num(m.protein); acc.carbs += num(m.carbs); acc.fat += num(m.fat); return acc;
  },{calories:0,protein:0,carbs:0,fat:0});
}
function logMeal(entry){

function macroLine(label, eaten, target, color){
  const remaining = target - eaten;
  const over = remaining < 0;
  const pct = target>0 ? Math.min(100, Math.round(eaten/target*100)) : 0;
  const remTxt = over ? `<span class="over-text">+${round1(Math.abs(remaining))} over</span>` : `${round1(remaining)} left`;
  const style = color ? ` style="--mcolor:${color}"` : '';
  return `<div class="macrobar-wrap"${style}>
    <div class="macrobar-label"><span>${label}: <b>${round1(eaten)}</b> / ${round1(target)}</span><span>${remTxt}</span></div>
    <div class="macrobar"><div class="${over?'over':''}" style="width:${pct}%"></div></div>
  </div>`;
}
// Circular calorie-remaining ring, in the spirit of Fitonomy's "kcal left" dial.
// Pure inline SVG, no chart library.
function calorieRing(eaten, target){
  const r = 54, c = 2*Math.PI*r;
  const pct = target>0 ? Math.min(1, eaten/target) : 0;
  const remaining = Math.round(target - eaten);
  const over = remaining < 0;
  return `<div class="ring-wrap">
    <svg width="132" height="132" viewBox="0 0 132 132">
      <circle cx="66" cy="66" r="${r}" fill="none" stroke="#1c2436" stroke-width="10"/>
      <circle cx="66" cy="66" r="${r}" fill="none" stroke="${over?'var(--danger)':'url(#ringGrad)'}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 66 66)"/>
      <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4f7fff"/><stop offset="100%" stop-color="#2dd4a7"/>
      </linearGradient></defs>
    </svg>
    <div class="ring-overlay">
      <div class="ring-value">${over?('+'+Math.abs(remaining)):remaining}</div>
      <div class="ring-label">${over?'kcal over':'kcal left'}</div>
    </div>
  </div>`;
}

    ${macroLine('Protein', eaten.protein, settings.proteinTarget, 'var(--protein)')}
    ${macroLine('Carbs', eaten.carbs, settings.carbTarget, 'var(--carbs)')}
    ${macroLine('Fat', eaten.fat, settings.fatTarget, 'var(--fat)')}
  </div>`;
  if(!meals.length){
    html += `<div class="notice info" style="margin-top:14px">No meals logged for ${esc(eatDate)} yet. Use Log meal to add one.</div>`;
  } else {

}

function wireModeBodyEvents(mode){

function submitSavedFood(){

async function submitParse(){
  const text = document.getElementById('npText').value.trim();
  if(!text){ toast('Describe what you ate first'); return; }
  const btn = document.getElementById('npBtn');
  const resultEl = document.getElementById('npResult');
  if(!navigator.onLine){ resultEl.innerHTML = `<div class="notice">Online connection required</div>`; return; }
  btn.disabled = true; btn.textContent = 'Parsing…';
  resultEl.innerHTML = '';
  try {
    const res = await fetch('/api/nutrition-parse', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text}) });
    if(!res.ok){
      let msg = 'Could not parse that text.';
      try { const j = await res.json(); if(j && j.error) msg = j.error; } catch(e){}
      resultEl.innerHTML = `<div class="notice">${esc(msg)}</div>`;
      return;
    }
    const data = await res.json();
    if(!data || !Array.isArray(data.items) || !data.items.length){
      resultEl.innerHTML = `<div class="notice">No food items were found in that text.</div>`;
      return;
    }
    pendingParse = { items: data.items.map(it=>({...it, matchedFoodId: matchFoodByName(it.name)})) };
    if(!milestones.usedAIParse){ milestones.usedAIParse = true; saveNS(NS.milestones, milestones); }
    renderParseReview();
  } catch(e){
    resultEl.innerHTML = `<div class="notice">Online connection required</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '✨ Parse with AI';
  }
}
function matchFoodByName(name){
  const n = String(name||'').toLowerCase();
  const hit = foods.foods.find(f=>{
    const fn = f.name.toLowerCase();
    return fn.includes(n) || n.includes(fn.split('(')[0].trim());
  });
  return hit ? hit.id : null;
}
function renderParseReview(){
  const resultEl = document.getElementById('npResult');
  if(!pendingParse){ resultEl.innerHTML=''; return; }
  let html = `<div class="notice info">Review each item — matched items use your saved-food values; unmatched items need confirmation before logging.</div>`;
  pendingParse.items.forEach((it,i)=>{
    const f = it.matchedFoodId ? findFood(it.matchedFoodId) : null;
    const m = f ? scaledMacros(f, it.quantity, it.unit) : null;
    html += `<div class="card" style="padding:12px;margin:10px 0">
      <div class="fname">${esc(it.name)} — ${esc(String(it.quantity))} ${esc(it.unit)}</div>`;
    if(f && m){
      html += `<div class="fmeta">Matched: ${esc(f.name)} → ${m.calories} kcal · ${m.protein}P / ${m.carbs}C / ${m.fat}F</div>
        <button class="icon-btn" onclick="acceptParsedItem(${i})">Confirm & log</button>
        <button class="icon-btn" onclick="manualizeParsedItem(${i})" style="margin-left:6px">Enter manually instead</button>`;
    } else {
      html += `<div class="fmeta">No saved-food match${f?' (unit incompatible)':''}. Enter nutrition manually to log this item.</div>
        <div class="row" style="margin-top:8px">
          <input class="detail-input pi-cal" data-i="${i}" inputmode="decimal" placeholder="kcal">
          <input class="detail-input pi-pro" data-i="${i}" inputmode="decimal" placeholder="protein g">
        </div>
        <div class="row" style="margin-top:8px">
          <input class="detail-input pi-carb" data-i="${i}" inputmode="decimal" placeholder="carbs g">
          <input class="detail-input pi-fat" data-i="${i}" inputmode="decimal" placeholder="fat g">
        </div>
        <button class="icon-btn" style="margin-top:8px" onclick="acceptManualParsedItem(${i})">Confirm & log</button>`;
    }
    html += `</div>`;
  });
  resultEl.innerHTML = html;
}
function acceptParsedItem(i){
  const it = pendingParse.items[i]; const f = findFood(it.matchedFoodId); const m = scaledMacros(f, it.quantity, it.unit);
  if(!m){ toast('Could not compute macros for this item'); return; }
  const now = new Date();
  logMeal({date:eatDate, ts:now.getTime(), time:new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(now), name:`${it.name} (${it.quantity}${it.unit})`, calories:m.calories, protein:m.protein, carbs:m.carbs, fat:m.fat, source:'ai-parse-matched', foodId:f.id});

function manualizeParsedItem(i){ pendingParse.items[i].matchedFoodId = null; renderParseReview(); }
function acceptManualParsedItem(i){

let planSubview = 'pricing';

function pricePerUnit(f){ return f.priceQty>0 ? f.pricePkr/f.priceQty : 0; }
function priceDerived(f){
  // Cost of exactly one basis serving, priced from whatever priceQty/priceUnit
  // the user entered. Falls back to null (shown as "—") when the price unit
  // isn't compatible with the basis unit — we never guess a conversion.
  const perServing = estimateItemCost({food:f, qty:f.basisQty});
  let per100g = null, per25gProtein = null, per500kcal = null;
  if(isWeightUnit(f.priceUnit)){
    const pricePerGram = pricePerUnit(f)/toGrams(1,f.priceUnit);
    per100g = pricePerGram*100;
  }
  if(Number.isFinite(perServing)){
    if(f.protein>0) per25gProtein = perServing/f.protein*25;
    if(f.calories>0) per500kcal = perServing/f.calories*500;
  }
  return { perServing: Number.isFinite(perServing)?perServing:null, per100g, per25gProtein, per500kcal };
}

// Bounded brute-force solver. The saved-food list is small by design (spec:
// up to ~200 foods), so we pre-filter to a small candidate pool per mode,
// then enumerate combinations of 1–3 foods across a handful of serving
// multipliers. No network calls — deterministic, local only.
function solveMeal(mode, remaining){
  let pool = foods.foods.filter(f=>f.calories>0 || f.protein>0);
  if(mode==='GI Friendly') pool = pool.filter(f=>f.giTolerance==='good' || f.giTolerance==='unknown');
  if(mode==='Pre Workout') pool = pool.slice().sort((a,b)=>(b.carbs/Math.max(1,b.calories))-(a.carbs/Math.max(1,a.calories)));
  else if(mode==='Post Workout') pool = pool.slice().sort((a,b)=>(b.protein+b.carbs*0.5)-(a.protein+a.carbs*0.5));
  else if(mode==='Highest Protein') pool = pool.slice().sort((a,b)=>b.protein-a.protein);
  else if(mode==='Cheapest') pool = pool.slice().sort((a,b)=>pricePerUnit(a)-pricePerUnit(b));
  else if(mode==='Low Effort') pool = pool.slice().sort((a,b)=>a.name.length-b.name.length);
  const candidates = pool.slice(0, 10);
  const multipliers = [0.5,1,1.5,2,3];
  const combos = [];
  const maxItems = mode==='Low Effort' ? 1 : 3;
  function* combosOfSize(arr,size){
    if(size===0){ yield []; return; }
    for(let i=0;i<arr.length;i++){
      for(const rest of combosOfSize(arr.slice(i+1),size-1)) yield [arr[i],...rest];
    }
  }
  for(let size=1; size<=maxItems; size++){
    for(const combo of combosOfSize(candidates,size)){
      const stacks = combo.map(()=>multipliers);
      const idxMax = stacks.map(s=>s.length);
      const idx = new Array(combo.length).fill(0);
      while(true){
        const items = combo.map((f,i)=>({food:f, qty: f.basisQty*multipliers[idx[i]]}));
        const totals = items.reduce((acc,it)=>{
          const m = scaledMacros(it.food, it.qty, it.food.basisUnit);
          acc.calories+=m.calories; acc.protein+=m.protein; acc.carbs+=m.carbs; acc.fat+=m.fat; return acc;
        },{calories:0,protein:0,carbs:0,fat:0});
        const diff = { calories: totals.calories-remaining.calories, protein: totals.protein-remaining.protein, carbs: totals.carbs-remaining.carbs, fat: totals.fat-remaining.fat };
        const withinCal = Math.abs(diff.calories) <= 100;
        const withinCarb = diff.carbs <= 5;
        const withinFat = diff.fat <= 5;
        if(totals.protein>0 || totals.calories>0){
          const cost = items.reduce((c,it)=>c+estimateItemCost(it),0);
          combos.push({ items, totals, diff, withinCal, withinCarb, withinFat, cost });
        }
        let carry=true, p=0;
        while(carry && p<idx.length){ idx[p]++; if(idx[p]>=idxMax[p]){ idx[p]=0; p++; } else carry=false; }
        if(carry) break;
      }
    }
  }
  const valid = combos.filter(c=>c.withinCarb && c.withinFat);
  const pickFrom = valid.length ? valid : combos;
  pickFrom.sort((a,b)=>{
    const proteinFit = Math.abs(a.diff.protein)-Math.abs(b.diff.protein);
    if(Math.abs(proteinFit)>0.01) return proteinFit;
    if(mode==='Cheapest') return a.cost-b.cost;
    if(mode==='Highest Protein') return b.totals.protein-a.totals.protein;
    return Math.abs(a.diff.calories)-Math.abs(b.diff.calories);
  });
  return pickFrom.slice(0,3).map((c,i)=>({ label:`${mode} option ${i+1}`, items:c.items, totals:c.totals, diff:c.diff, cost:c.cost }));
}
// it.qty is always expressed in the food's basisUnit. Returns cost in PKR,
// or NaN when priceUnit isn't compatible with basisUnit (never guessed).
function estimateItemCost(it){
  const f = it.food;
  if(f.priceUnit === f.basisUnit) return pricePerUnit(f)*it.qty;
  if(isWeightUnit(f.priceUnit) && isWeightUnit(f.basisUnit)){
    const grams = toGrams(it.qty, f.basisUnit);
    const pricePerGram = pricePerUnit(f)/toGrams(1,f.priceUnit);
    return pricePerGram*grams;
  }
  if(isVolumeUnit(f.priceUnit) && isVolumeUnit(f.basisUnit)){
    const ml = toMl(it.qty, f.basisUnit);
    const pricePerMl = pricePerUnit(f)/toMl(1,f.priceUnit);
    return pricePerMl*ml;
  }
  return NaN;
}

function weightSparkline(records){
  const pts = records
    .filter(r=>r.weightKg!=null && r.weightKg!=='')
    .map(r=>({date:r.date, w:num(r.weightKg)}))
    .sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0))
    .slice(-30);
  if(pts.length<2) return null;
  const w=300,h=64,pad=6;
  const min = Math.min(...pts.map(p=>p.w)), max = Math.max(...pts.map(p=>p.w));
  const span = Math.max(0.5, max-min);
  const xs = pts.map((p,i)=> pad + (i/(pts.length-1))*(w-2*pad));
  const ys = pts.map(p=> h-pad - ((p.w-min)/span)*(h-2*pad));
  const path = xs.map((x,i)=>`${i===0?'M':'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <path d="${path}" fill="none" stroke="url(#wgrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${xs[xs.length-1]}" cy="${ys[ys.length-1]}" r="3.5" fill="#2dd4a7"/>
    <defs><linearGradient id="wgrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4f7fff"/><stop offset="100%" stop-color="#2dd4a7"/></linearGradient></defs>
  </svg>
  <div class="fmeta">${round1(pts[0].w)}kg → ${round1(pts[pts.length-1].w)}kg over last ${pts.length} logged day(s)</div>`;
}
// Adherence calendar. "Completed" = a session finished that day with 80%+
// of its sets marked done; "Partial" = a session finished with some sets
// done. There is no fixed weekly schedule in this app, so we never claim a
// day was "missed" -- only what was actually logged is shown.
function adherenceCalendarHtml(monthDate){
  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const startDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = localDateStr();
  const byDate = {};
  training.sessions.forEach(s=>{
    const d = localDateStr(new Date(s.finishedAt));
    const ratio = s.totalSets>0 ? s.completedSets/s.totalSets : 0;
    if(byDate[d]==null || ratio>byDate[d]) byDate[d]=ratio;
  });
  const monthLabel = new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(monthDate);
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const ratio = byDate[dateStr];
    const dotClass = ratio==null ? '' : (ratio>=0.8 ? 'completed' : 'partial');
    const isToday = dateStr===todayStr;
    cells += `<div class="cal-cell${isToday?' today':''}"><span>${day}</span>${dotClass?`<i class="cal-dot ${dotClass}"></i>`:''}</div>`;
  }
  return `<div class="card" style="padding:14px">
    <div class="cal-header">
      <button class="icon-btn" onclick="shiftProgressCalendar(-1)">‹</button>
      <b>${esc(monthLabel)}</b>
      <button class="icon-btn" onclick="shiftProgressCalendar(1)">›</button>
    </div>
    <div class="cal-grid cal-dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal-grid">${cells}</div>
    <div class="tag-row"><span class="pill"><i class="cal-dot completed"></i> Completed</span><span class="pill"><i class="cal-dot partial"></i> Partial</span></div>
  </div>`;
}
function shiftProgressCalendar(delta){
  progressCalMonth = new Date(progressCalMonth.getFullYear(), progressCalMonth.getMonth()+delta, 1);
  renderProgress();
}

function progressRecordsHtml(){
  const prs = personalRecords();
  const ach = achievementsList();
  const unlockedCount = ach.filter(a=>a.unlocked).length;
  let html = `<div class="section-title" style="margin-top:0"><h2>Personal records</h2><span>${prs.length} logged</span></div>`;
  if(!prs.length){ html += `<div class="notice info">No personal records yet — the heaviest logged load per exercise will appear here once you complete workouts.</div>`; }
  prs.slice(0,30).forEach(r=>{
    html += `<div class="card food-row" style="padding:12px 14px"><div><div class="fname">${esc(r.exerciseName)}</div><div class="fmeta">${fmtDate(r.date)}</div></div><span class="pill">${round1(r.load)} ${esc(training.settings.unit)} × ${esc(r.reps||'—')}</span></div>`;

/* =========================================================================
   TODAY module — command center + deterministic Next Action
   ========================================================================= */
// Not persisted — resets on reload. Lets the Today screen offer a
// different next workout without committing to a schedule change.
let shuffledWorkoutId = null;
function nextWorkoutSuggestion(){
  if(shuffledWorkoutId) return shuffledWorkoutId;
  const last = training.sessions[0];
  if(!last) return 'pushA';
  const idx = WORKOUT_ORDER.indexOf(last.workoutId);
  return WORKOUT_ORDER[(idx+1) % WORKOUT_ORDER.length];
}
function shuffleNextWorkout(){
  const current = nextWorkoutSuggestion();
  const idx = WORKOUT_ORDER.indexOf(current);
  shuffledWorkoutId = WORKOUT_ORDER[(idx+1) % WORKOUT_ORDER.length];
  renderToday();
}
function computeNextAction(eaten, todayRec){
  if(training.active){
    const w = PROGRAM[training.active.workoutId];
    return {text:`Resume ${w.name} — ${completedSets(training.active)}/${totalSets(w)} sets done.`, cta:{label:'Resume workout', screen:'train'}};
  }
  const now = new Date();
  const hoursElapsed = Math.max(1, now.getHours() + now.getMinutes()/60);
  const dayFrac = Math.min(1, Math.max(0.15, hoursElapsed/16));
  const proteinPace = settings.proteinTarget*dayFrac;
  const carbPace = settings.carbTarget*dayFrac;
  const calPace = settings.calorieTarget*dayFrac;

  const reasons = [];
  if(!todayRec || todayRec.weightKg==='' || todayRec.weightKg==null){
    reasons.push({priority:2, text:"Log this morning's weight to keep the 7-day trend accurate.", cta:{label:'Log weight', screen:'progress'}});
  }
  if(eaten.protein < proteinPace - 20){
    reasons.push({priority:5, text:`Protein is behind pace (${round1(eaten.protein)}g of ~${Math.round(proteinPace)}g expected by now) — make the next meal protein-first.`, cta:{label:'Log meal', screen:'eat'}});
  } else if(eaten.carbs >= settings.carbTarget - 10 && eaten.protein < settings.proteinTarget - 20){
    reasons.push({priority:4, text:'Carbs are close to target and protein is still low — favor a lean, low-carb protein source next. A mass gainer is not recommended right now.', cta:{label:'Log meal', screen:'eat'}});
  } else if(eaten.calories < calPace-150 && eaten.carbs < carbPace-20){
    reasons.push({priority:4, text:'Calories and carbs are both meaningfully behind pace — a mass-gainer shake is a reasonable option right now.', cta:{label:'Log meal', screen:'eat'}});
  }
  if(!reasons.length) reasons.push({priority:1, text:"On pace — keep logging meals and finish today's training if scheduled.", cta:{label:'Open Train', screen:'train'}});
  reasons.sort((a,b)=>b.priority-a.priority);
  return reasons[0];
}
function renderToday(){
  const el = document.getElementById('todayScreen');
  const today = localDateStr();
  const todayRec = bodyRecordFor(today);
  const last = body.records.find(r=>r.weightKg!=='' && r.weightKg!=null);
  const last7 = body.records.filter(r=>r.date >= localDateStr(new Date(Date.now()-6*86400000)) && r.weightKg!=null && r.weightKg!=='');
  const w7 = avgWeight(last7);
  const eaten = sumMacros(mealsForDate(today));
  const steps = todayRec?.steps || 0;
  const nextWid = nextWorkoutSuggestion();
  const action = computeNextAction(eaten, todayRec);

  const streak = trainingStreak();
  const hydration = num(todayRec?.hydrationMl, 0);
  let html = `<div class="card hero">
    <div class="hero-row"><div><h2>${esc(todayLong())}</h2><p>Command center for today.</p></div><span class="badge">🔥 ${streak}</span></div>
    <div class="stats">
      <div class="stat"><strong>${last&&last.weightKg!=null&&last.weightKg!=='' ? round1(last.weightKg)+'kg' : '—'}</strong><span>latest weight</span></div>
      <div class="stat"><strong>${w7!=null ? round1(w7)+'kg' : '—'}</strong><span>7-day avg</span></div>
      <div class="stat"><strong>${steps}/${settings.stepTarget}</strong><span>steps</span></div>
    </div>
  </div>
  ${settings.hydrationTargetMl>0 ? `<div class="card" style="padding:14px;margin-top:10px">${macroLine('Hydration (ml)', hydration, settings.hydrationTargetMl, '#4fb8ff')}</div>` : ''}
  <div class="section-title"><h2>Macros</h2></div>
  <div class="card" style="padding:16px">
    ${calorieRing(eaten.calories, settings.calorieTarget)}
    ${macroLine('Protein', eaten.protein, settings.proteinTarget, 'var(--protein)')}
    ${macroLine('Carbs', eaten.carbs, settings.carbTarget, 'var(--carbs)')}
    ${macroLine('Fat', eaten.fat, settings.fatTarget, 'var(--fat)')}
  </div>
  <span class="eyebrow" style="margin-top:24px">Next action</span>
  <div class="notice good">${esc(action.text)}</div>
  <button class="grad-btn wide" style="margin-top:10px" onclick="showScreen('${action.cta.screen}')">${esc(action.cta.label)}</button>
  <div class="section-title"><h2>Training</h2></div>
  <div class="card" style="padding:14px">`;
  if(training.active){
    const w = PROGRAM[training.active.workoutId];
    html += `<div class="fname">${esc(w.name)} in progress</div><div class="fmeta">${completedSets(training.active)}/${totalSets(w)} sets</div>
      <button class="secondary wide" style="margin-top:10px" onclick="goTrainLog()">Resume</button>`;
  } else {
    const w = PROGRAM[nextWid];
    html += `<span class="eyebrow" style="margin:0 0 6px">Up next</span>
      <div class="fname">${esc(w.name)}</div><div class="fmeta">${esc(w.focus)}</div>
      <div class="row" style="margin-top:10px">
        <button class="secondary" onclick="shuffleNextWorkout()">🔀 Shuffle</button>
        <button class="grad-btn" onclick="startWorkout('${nextWid}')">Start</button>
      </div>`;
  }
  html += `</div>
  <div class="section-title"><h2>GI summary</h2></div>
  <div class="card" style="padding:14px">`;
  if(todayRec){
    html += `<div class="fmeta">Bloating ${todayRec.bloating} · Reflux ${todayRec.reflux} · Bowel ${todayRec.bowel}</div>`;
  } else {
    html += `<div class="fmeta">No GI data logged today.</div>`;
  }
  html += `<button class="secondary wide" style="margin-top:10px" onclick="showScreen('progress')">Log GI / weight</button></div>`;
  el.innerHTML = html;
}

/* =========================================================================
   BACKUP — unified export/import (schemaVersion 2) + legacy v1 import
   ========================================================================= */
function exportAll(){
  const backup = { schemaVersion:2, exportedAt:new Date().toISOString(), training, nutrition, foods, body, settings, milestones };
  const blob = new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `sculpt-backup-${localDateStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function snapshotForRollback(){
  return { training, nutrition, foods, body, settings, milestones };
}
function importAll(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch(e){ alert('That file is not valid JSON.'); return; }

    // Unified v2 backup (milestones is optional for backward compatibility
    // with backups exported before that field existed).
    if(data && data.schemaVersion===2 && data.training && data.nutrition && data.foods && data.body && data.settings){
      localStorage.setItem('sculpt.v2.rollback', JSON.stringify(snapshotForRollback()));
      training = data.training; nutrition = data.nutrition; foods = data.foods; body = data.body; settings = data.settings;
      milestones = data.milestones && typeof data.milestones==='object' ? data.milestones : defaultMilestones();
      saveAll();
      toast('Backup imported'); renderSettings(); renderToday();
      return;
    }
    // Legacy Sculpt v1 workout-only backup
    if(data && Array.isArray(data.sessions) && data.settings && !data.schemaVersion){
      localStorage.setItem('sculpt.v2.rollback', JSON.stringify(snapshotForRollback()));
      training = { sessions: data.sessions, active: data.active||null, settings: data.settings };
      saveNS(NS.training, training);
      toast('Legacy workout backup imported'); renderSettings();
      return;
    }
    alert('That file is not a recognized Sculpt backup.');
  };
  r.readAsText(file);
}
function restoreRollback(){
  const raw = localStorage.getItem('sculpt.v2.rollback');
  if(!raw){ toast('No pre-import snapshot available'); return; }
  try {
    const snap = JSON.parse(raw);
    training = snap.training; nutrition = snap.nutrition; foods = snap.foods; body = snap.body; settings = snap.settings;
    milestones = snap.milestones && typeof snap.milestones==='object' ? snap.milestones : defaultMilestones();
    saveAll();
    toast('Rollback snapshot restored'); renderSettings(); renderToday();
  } catch(e){ toast('Rollback snapshot is corrupted'); }
}
function clearAllData(){
  if(!confirm('Delete ALL Sculpt v2 data on this device (training, nutrition, foods, body, settings)? Legacy keys are left untouched.')) return;
  training = defaultTraining(); nutrition = defaultNutrition(); foods = seedFoods(); body = defaultBody(); settings = defaultSettings(); milestones = defaultMilestones();
  saveAll();
  toast('Sculpt v2 data deleted'); showScreen('today');
}

/* =========================================================================
   Navigation, modal, toast
   ========================================================================= */
let currentScreen = 'today';
function showScreen(name){
  currentScreen = name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name+'Screen').classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active', b.dataset.screen===name));
  if(name==='today') renderToday();
  else if(name==='train') renderTrain();
  else if(name==='eat') renderEat();
  else if(name==='plan') renderPlan();
  else if(name==='progress') renderProgress();
  else if(name==='settings') renderSettings();
  window.scrollTo({top:0,behavior:'instant'});
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.screen)));
document.getElementById('timerStop').onclick=()=>{ clearInterval(timerInterval); timerInterval=null; document.getElementById('timerBox').classList.remove('show'); };

function showModal(html){ document.getElementById('modal').innerHTML=html; document.getElementById('modalBackdrop').classList.add('show'); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('show'); }
document.getElementById('modalBackdrop').addEventListener('click',e=>{ if(e.target.id==='modalBackdrop') closeModal(); });
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

function maybeInstallTip(){
  const standalone=window.navigator.standalone===true || window.matchMedia('(display-mode: standalone)').matches;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios && !standalone && !sessionStorage.getItem('installTipShown')){
    sessionStorage.setItem('installTipShown','1');
    setTimeout(()=>toast('Tip: Add this to your Home Screen from Safari'),900);
  }
}

document.getElementById('todayBadge').textContent = todayLong();
renderToday();
maybeInstallTip();
if(migrationResult.ran){ setTimeout(()=>toast('Legacy data imported'), 500); }
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
