<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sculpt" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Sculpt</title>
  <script>
    // A journal makes interrupted multi-key imports recoverable before app state loads.
    try{const journal=localStorage.getItem('sculpt.v3.importJournal');if(journal){const saved=JSON.parse(journal);for(const [key,value] of Object.entries(saved)){if(!key.startsWith('sculpt.'))throw new Error('Invalid import journal');if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}localStorage.removeItem('sculpt.v3.importJournal');}}catch(e){document.documentElement.dataset.storageRecovery='required';}
    try{const pref=JSON.parse(localStorage.getItem('sculpt.v2.settings')||'{}').theme||'system';const theme=pref==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):pref;document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content=theme==='dark'?'black-translucent':'default';}catch(e){document.documentElement.dataset.theme='light';}
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="nutrition.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Sculpt</h1>
        <p>Training + nutrition + progress</p>
      </div>
      <div class="badge" id="todayBadge">Today</div>
    </header>

    <main>
      <section id="todayScreen" class="screen active"></section>
      <section id="trainScreen" class="screen"></section>
      <section id="eatScreen" class="screen"></section>
      <section id="planScreen" class="screen"></section>
      <section id="progressScreen" class="screen"></section>
      <section id="settingsScreen" class="screen"></section>
      <section id="mobilityScreen" class="screen"></section>
      <section id="safetyScreen" class="screen"></section>
    </main>
  </div>

  <div class="timer" id="timerBox">
    <div class="timer-dial" role="timer" aria-label="Countdown"><strong id="timerText">01:30</strong></div><div><span id="timerLabel" aria-live="polite">Rest</span><div class="timer-actions"><button id="timerPause" onclick="pauseTimer()">Pause</button><button onclick="addTimer()">+30s</button><button onclick="resetTimer()">Reset</button><button id="timerStop">Skip</button></div></div>
  </div>
  <div class="toast" id="toast"></div>

  <nav class="nav">
    <div class="nav-inner">
      <button data-screen="today" class="active"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8M5 10v11h5v-7h4v7h5V10"/></svg></span>Today</button>
      <button data-screen="train"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9v6M3 10v4M18 9v6M21 10v4M6 12h12"/></svg></span>Train</button>
      <button data-screen="eat"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v6a2 2 0 0 0 4 0V3M7 3v18M18 3c-4 3-4 9 0 9v9M18 3v9"/></svg></span>Eat</button>
      <button data-screen="plan"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 12h1m6 0h1M8 16h1m6 0h1"/></svg></span>Plan</button>
      <button data-screen="progress"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16M7 15l4-5 4 2 5-7"/></svg></span>Progress</button>
      <button data-screen="mobility"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></span>Mobility</button>
      <button data-screen="settings"><span class="ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg></span>Settings</button>
    </div>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>

<script src="nutrition-core.js"></script>
<script src="core.js"></script>
<script src="program-data.js"></script>
<script src="app.js"></script>
<script src="storage.js"></script>
<script src="upgrade.js"></script>
<script src="nutrition.js"></script>
<script>
document.getElementById('todayBadge').textContent = todayLong();
renderToday();
if(restTimer){tickTimer();timerInterval=setInterval(tickTimer,1000);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkLocalDay();tickTimer();showScreen(currentScreen);}});
setInterval(()=>{const before=calendarDay;checkLocalDay();if(before!==calendarDay)showScreen(currentScreen);},30000);
maybeInstallTip();
if(migrationResult.ran){ setTimeout(()=>toast('Legacy data imported'), 500); }
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
if('serviceWorker' in navigator){let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload();}});}
</script>
</body>
</html>
